apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: urjamitra-ocr-worker-scaler
spec:
  scaleTargetRef:
    name: urjamitra-ocr-worker
  minReplicaCount: 1
  maxReplicaCount: 20
  cooldownPeriod: 300
  triggers:
  - type: redis
    metadata:
      address: redis-service:6379
      listName: ocr_processing_queue
      listLength: "5"  # Spawn a new OCR worker for every 5 pending bill/meter photos
