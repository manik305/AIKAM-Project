apiVersion: v1
kind: ConfigMap
metadata:
  name: urjamitra-config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: urjamitra-secrets
type: Opaque
stringData:
  # In production, inject secrets from Azure Key Vault CSI Provider
  DATABASE_URL: "postgresql+asyncpg://urjamitra_user:change_in_prod@postgres-service:5432/urjamitra_db"
  REDIS_URL: "redis://redis-service:6379/0"
  SECRET_KEY: "prod-secret-key-injected-from-key-vault"
