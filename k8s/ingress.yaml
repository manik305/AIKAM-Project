apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urjamitra-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - urjamitra.tgspdcl.gov.in
    secretName: urjamitra-tls-cert
  rules:
  - host: urjamitra.tgspdcl.gov.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: urjamitra-api-service
            port:
              number: 8000
